#            (keeps broad aliases like "rupee" from flooding the scorer)
#   query    Google News query for this entity (defaults to the first alias)
#   description, facts  shown on the entity page in the dashboard
#
# links: how news about a node reaches a tracked stock.
#   weight   0..1 exposure. Client revenue shares are mostly undisclosed, so these
#            are judgement calls: 0.6 high, 0.35 medium, 0.15 low. Tune them.
#   sign     +1 good-for-source is good-for-target; -1 for competitors.
#            Only the offline lexicon scorer uses sign; the LLM reasons about
#            direction itself from the relation.
#
